<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Clicker Pro - Purpleguy Edition</title>
    
    <!-- PWA ve Manifest Bağlantıları -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a855f7">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Özel Stil Dosyamız (Işık modu ve kaydırma çubukları için) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen font-sans transition-colors duration-300">

    <!-- Üst Bar (Header) -->
    <header class="bg-zinc-800/80 backdrop-blur-md border-b border-zinc-700/50 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-wider text-purple-500 flex items-center gap-2">
                <span class="text-2xl">🟣</span> Purple Clicker Pro
            </h1>
            <div class="flex items-center gap-3">
                <!-- Işık Modu Tuşu -->
                <button id="theme-toggle" class="p-2 rounded-lg bg-zinc-700/50 hover:bg-zinc-700 text-lg transition">💡</button>
                <!-- Kullanıcı Profil/Çıkış Alanı -->
                <div id="auth-status" class="hidden flex items-center gap-2">
                    <span id="user-display-name" class="text-sm font-medium text-zinc-300"></span>
                    <button id="btn-logout" class="text-xs bg-red-500/20 hover:bg-red-500/40 text-red-300 px-2 py-1 rounded border border-red-500/30 transition">Çıkış</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Giriş Ekranı (Giriş Yapılmamışsa Gösterilecek) -->
    <div id="auth-container" class="max-w-md mx-auto mt-20 px-4">
        <div class="bg-zinc-800 border border-zinc-700 p-6 rounded-2xl shadow-xl text-center">
            <h2 class="text-2xl font-bold mb-2 text-purple-400">Hoş Geldiniz</h2>
            <p class="text-zinc-400 text-sm mb-6">Skorunuzu küresel sıralamaya kaydetmek için giriş yapın.</p>
            
            <button id="btn-google-login" class="w-full flex items-center justify-center gap-3 bg-white text-zinc-950 font-bold py-3 px-4 rounded-xl hover:bg-zinc-100 transition shadow-lg">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.2-5.136 4.2A5.72 5.72 0 0 1 8.2 12a5.72 5.72 0 0 1 5.79-6.6c1.498 0 2.857.55 3.908 1.455l3.124-3.124C19.145 1.99 16.657 1 14 1 7.925 1 3 5.925 3 12s4.925 11 11 11c6.3 0 10.5-4.425 10.5-10.715 0-.726-.065-1.423-.19-2 Merton"/>
                </svg>
                Google ile Oturum Aç
            </button>
        </div>
    </div>

    <!-- Ana Oyun Ekranı (Giriş Yapılınca Aktif Olur) -->
    <main id="game-container" class="max-w-4xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
        
        <!-- Sol Taraf: Tıklama Alanı -->
        <div class="flex flex-col items-center justify-center bg-zinc-800/40 border border-zinc-700/40 p-6 rounded-3xl relative overflow-hidden h-[450px]">
            <!-- Skor Göstergesi -->
            <div class="text-center mb-6">
                <div class="text-zinc-400 uppercase text-xs tracking-widest font-bold">Toplam Mor Güç</div>
                <div id="score-display" class="text-4xl md:text-5xl font-black text-purple-400 font-mono mt-1">0</div>
            </div>

            <!-- Ana Tıklama Butonu -->
            <button id="click-btn" class="w-48 h-48 rounded-full bg-gradient-to-br from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white shadow-2xl shadow-purple-500/20 flex items-center justify-center border-4 border-purple-400/30 transform active:scale-95 transition-all duration-75 select-none outline-none">
                <span class="text-6xl font-bold select-none drop-shadow-md">🟣</span>
            </button>
            
            <p class="text-zinc-500 text-xs mt-6 italic">Hile koruması (Anti-Cheat) aktiftir.</p>
        </div>

        <!-- Sağ Taraf: Sıralama ve Market Sekmesi -->
        <div class="space-y-6">
            <!-- Küresel Sıralama Paneli -->
            <div class="bg-zinc-800/80 border border-zinc-700 rounded-2xl p-4 flex flex-col h-[210px]">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-zinc-300 flex items-center gap-2">🏆 Küresel Sıralama</h3>
                    <!-- Yenile Butonu -->
                    <button id="refresh-leaderboard" class="p-1.5 rounded-lg bg-zinc-700/50 hover:bg-zinc-700 text-xs font-semibold flex items-center gap-1 transition text-zinc-300">
                        🔄 Yenile
                    </button>
                </div>
                <!-- Sıralama Listesi (Kaydırılabilir alan) -->
                <div id="leaderboard-list" class="space-y-2 overflow-y-auto flex-1 pr-1 text-sm custom-scrollbar">
                    <!-- JS tarafından dinamik doldurulacak -->
                </div>
            </div>

            <!-- Kara Borsa Mağazası Başlangıcı (Geliştirilebilir Ürün Bölümü) -->
            <div class="bg-zinc-800/80 border border-zinc-700 rounded-2xl p-4 flex flex-col h-[210px]">
                <h3 class="font-bold text-zinc-300 mb-3 flex items-center gap-2">🏴‍☠️ Mağaza (Upgrade)</h3>
                <div id="market-list" class="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                    <!-- Dükkan eşyaları buraya yüklenecek -->
                </div>
            </div>
        </div>
    </main>

    <!-- Oyun Mantığı ve Firebase Yönetimi -->
    <script type="module" href="app.js"></script>

    <!-- PWA Service Worker Kaydı -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(reg => console.log("PWA Service Worker başarıyla bağlandı!", reg.scope))
                    .catch(err => console.log("Service Worker bağlantısı başarısız:", err));
            });
        }
    </script>
</body>
</html>
