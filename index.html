<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple Clicker Pro</title>
    <!-- Tailwind CSS (Modern UI için) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Bizim Özel Stil Dosyamız -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-neutral-900 text-white min-h-screen font-sans">

    <!-- GİRİŞ / KAYIT EKRANI -->
    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-neutral-800 p-8 rounded-2xl shadow-2xl border border-purple-500 w-full max-w-md card">
            <h1 class="text-3xl font-black text-center text-purple-500 mb-6 tracking-wider">PURPLE CLICKER PRO</h1>
            
            <div class="space-y-4">
                <input type="email" id="email" placeholder="E-posta" class="w-full p-3 rounded-lg bg-neutral-700 border border-neutral-600 focus:outline-none focus:border-purple-500">
                <input type="password" id="password" placeholder="Şifre" class="w-full p-3 rounded-lg bg-neutral-700 border border-neutral-600 focus:outline-none focus:border-purple-500">
                
                <div class="flex gap-2 pt-2">
                    <button onclick="login()" class="flex-1 bg-purple-600 hover:bg-purple-700 p-3 rounded-lg font-bold transition">Giriş Yap</button>
                    <button onclick="register()" class="flex-1 bg-neutral-700 hover:bg-neutral-600 p-3 rounded-lg font-bold transition">Kayıt Ol</button>
                </div>
                
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-neutral-600"></div>
                    <span class="flex-shrink mx-4 text-neutral-400 text-sm">VEYA</span>
                    <div class="flex-grow border-t border-neutral-600"></div>
                </div>
                
                <button onclick="loginWithGoogle()" class="w-full bg-white text-black hover:bg-gray-200 p-3 rounded-lg font-bold flex items-center justify-center gap-2 transition">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5.04c1.64 0 3.12.56 4.28 1.67l3.2-3.2C17.52 1.58 14.92 1 12 1 7.35 1 3.4 3.65 1.5 7.5l3.85 3C6.25 7.6 8.9 5.04 12 5.04z"/><path fill="#4285F4" d="M23.49 12.27c0-.82-.07-1.61-.21-2.38H12v4.51h6.44c-.28 1.48-1.12 2.73-2.38 3.58l3.7 2.87c2.16-2 3.73-4.94 3.73-8.58z"/><path fill="#FBBC05" d="M5.35 14.83c-.25-.75-.39-1.55-.39-2.38s.14-1.63.39-2.38L1.5 7.07C.54 9 .01 11.17.01 13.5s.53 4.5 1.49 6.43l3.85-3.1z"/><path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.92l-3.7-2.87c-1.03.69-2.35 1.11-4.26 1.11-3.1 0-5.75-2.56-6.65-5.46l-3.85 3C3.4 20.35 7.35 23 12 23z"/></svg>
                    Google ile Devam Et
                </button>
            </div>
        </div>
    </div>

    <!-- ANA OYUN EKRANI -->
    <div id="game-screen" class="hidden max-w-7xl mx-auto p-4 lg:p-8">
        
        <!-- Üst Bar Controls -->
        <div class="flex justify-between items-center mb-8 bg-neutral-800 p-4 rounded-xl border border-neutral-700 card">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <span id="user-display" class="font-medium text-purple-400">Oyuncu</span>
            </div>
            <div class="flex gap-4">
                <button onclick="toggleLightMode()" id="light-btn" class="bg-neutral-700 hover:bg-neutral-600 px-4 py-2 rounded-lg font-semibold text-sm transition">💡 Işığı Aç</button>
                <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-lg font-semibold text-sm transition">Çıkış</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- SOL KOLON: TIKLAMA ALANI -->
            <div class="flex flex-col items-center justify-center bg-neutral-800 p-8 rounded-2xl border border-purple-500/30 card min-h-[400px]">
                <h2 class="text-sm font-bold tracking-widest text-neutral-400 mb-2 uppercase">Toplam Mor Güç</h2>
                <div id="score" class="text-5xl font-black text-purple-500 mb-8 tracking-tight">0</div>
                
                <button onclick="registerClick(event)" class="w-56 h-56 rounded-full bg-gradient-to-tr from-purple-700 to-fuchsia-500 shadow-[0_0_40px_rgba(168,85,247,0.5)] hover:scale-105 active:scale-95 transition-all transform flex items-center justify-center cursor-pointer select-none border-4 border-purple-400">
                    <span class="text-2xl font-black tracking-wider drop-shadow-md">TIKLA!</span>
                </button>
                <p id="cps-display" class="mt-6 text-neutral-400 text-sm font-medium">Saniyede Üretim (CPS): <span class="text-white font-bold">0</span></p>
            </div>

            <!-- ORTA KOLON: KARA BORSA -->
            <div class="bg-neutral-800 p-6 rounded-2xl border border-neutral-700 card">
                <div class="flex justify-between items-center mb-4 border-b border-neutral-700 pb-2">
                    <h2 class="text-xl font-black text-purple-400 tracking-wide">🏴‍☠️ Kara Borsa</h2>
                    <span class="text-xs bg-purple-500/20 text-purple-300 px-2 py-1 rounded-full border border-purple-500/30 font-bold">Max Limit: 10</span>
                </div>
                <div id="shop-container" class="space-y-3 max-h-[550px] overflow-y-auto pr-2">
                    <!-- JS tarafından doldurulacak -->
                </div>
            </div>

            <!-- SAĞ KOLON: GLOBAL SCOREBOARD -->
            <div class="bg-neutral-800 p-6 rounded-2xl border border-neutral-700 card">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-black text-amber-400 tracking-wide">🏆 Küresel Sıralama</h2>
                    <button onclick="fetchLeaderboard()" class="bg-amber-500 hover:bg-amber-600 text-neutral-900 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1">
                        🔄 Yenile
                    </button>
                </div>
                <div id="leaderboard-list" class="space-y-2">
                    <!-- JS tarafından doldurulacak -->
                </div>
            </div>

        </div>
    </div>

    <!-- Ana Oyun Mantığı ve Firebase Modülü -->
    <script type="module" src="app.js"></script>
</body>
</html>
