<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Clicker Pro - Purpleguy Edition</title>
    
    <!-- PWA ve Manifest Bağlantıları -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a855f7">
    
    <!-- Özel Stil Dosyamız (Bütün Tasarım Buradan Yönetiliyor) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Üst Bar (Header) -->
    <header>
        <div class="header-container">
            <h1 class="logo">
                <span>🟣</span> Purple Clicker Pro
            </h1>
            <div class="header-right">
                <!-- Işık Modu Tuşu -->
                <button id="theme-toggle" class="btn-icon">💡</button>
                <!-- Kullanıcı Profil/Çıkış Alanı -->
                <div id="auth-status" class="hidden">
                    <span id="user-display-name"></span>
                    <button id="btn-logout" class="btn-danger">Çıkış</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Giriş Ekranı (Giriş Yapılmamışsa Gösterilecek) -->
    <div id="auth-container">
        <div class="auth-card">
            <h2>Hoş Geldiniz</h2>
            <p>Skorunuzu küresel sıralamaya kaydetmek için giriş yapın.</p>
            
            <button id="btn-google-login" class="btn-google">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.2-5.136 4.2A5.72 5.72 0 0 1 8.2 12a5.72 5.72 0 0 1 5.79-6.6c1.498 0 2.857.55 3.908 1.455l3.124-3.124C19.145 1.99 16.657 1 14 1 7.925 1 3 5.925 3 12s4.925 11 11 11c6.3 0 10.5-4.425 10.5-10.715 0-.726-.065-1.423-.19-2"/>
                </svg>
                Google ile Oturum Aç
            </button>
        </div>
    </div>

    <!-- Ana Oyun Ekranı (Giriş Yapılınca Aktif Olur) -->
    <main id="game-container" class="hidden">
        
        <!-- Sol Taraf: Tıklama Alanı -->
        <div class="click-section">
            <div class="score-container">
                <div class="score-title">Toplam Mor Güç</div>
                <div id="score-display">0</div>
            </div>

            <!-- Ana Tıklama Butonu -->
            <button id="click-btn">
                <span>🟣</span>
            </button>
            
            <p class="anti-cheat-text">Hile koruması (Anti-Cheat) aktiftir.</p>
        </div>

        <!-- Sağ Taraf: Sıralama ve Mağaza -->
        <div class="panels-section">
            <!-- Küresel Sıralama Paneli -->
            <div class="panel-box">
                <div class="panel-header">
                    <h3>🏆 Küresel Sıralama</h3>
                    <button id="refresh-leaderboard">🔄 Yenile</button>
                </div>
                <div id="leaderboard-list" class="custom-scrollbar">
                    <!-- JS tarafından dinamik doldurulacak -->
                </div>
            </div>

            <!-- Kara Borsa Mağazası -->
            <div class="panel-box">
                <div class="panel-header">
                    <h3>🏴‍☠️ Mağaza (Upgrade)</h3>
                </div>
                <div id="market-list" class="custom-scrollbar">
                    <!-- Dükkan eşyaları buraya yüklenecek -->
                </div>
            </div>
        </div>
    </main>

    <!-- Oyun Mantığı (Düzgün Yüklenmesi İçin src Yapıldı) -->
    <script type="module" src="app.js"></script>

    <!-- PWA Service Worker Kaydı -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(reg => console.log("PWA Service Worker başarıyla bağlandı!"))
                    .catch(err => console.log("Service Worker bağlantısı başarısız:", err));
            });
        }
    </script>
</body>
</html>
